[package]
name = "headroom-core"
version = "0.1.3"
edition = "2021"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
getrandom = "0.4.3"
keyring = "4.2.0"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "io-util", "sync"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
wiremock = "0.6.5"
