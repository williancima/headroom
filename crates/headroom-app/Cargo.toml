[package]
name = "headroom-app"
version = "0.1.9"
edition = "2021"
license = "MIT"
description = "Usage limits of your AI coding accounts"

[[bin]]
name = "headroom-app"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
headroom-core = { version = "0.1.9", path = "../headroom-core" }
# zbus's tokio feature makes the keyring's blocking Secret Service calls start a runtime inside ours (panic).
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
relm4 = { version = "0.11.0", default-features = false, features = ["libadwaita", "gnome_46"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = "1.29.3"

[build-dependencies]
glib-build-tools = "0.22"

# Build with `cargo build --release --workspace && cargo deb -p headroom-app --no-build`
# (the `headroom` CLI is another crate). Extension globs pick up new .js files; tests are .mjs.
[package.metadata.deb]
name = "headroom"
maintainer = "Willian Cima <williancima@gmail.com>"
section = "utils"
copyright = "2026 Robin Ebers, 2026 Willian Cima (MIT)"
depends = "$auto"
extended-description = "Shows the usage limits of your AI coding accounts in a GTK4 panel, the tray and the GNOME Shell top bar."
assets = [
  ["target/release/headroom-app", "usr/bin/", "755"],
  ["target/release/headroom", "usr/bin/", "755"],
  ["../../data/dev.headroom.Headroom.desktop", "usr/share/applications/", "644"],
  ["../../data/icons/hicolor/scalable/apps/*.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../data/icons/hicolor/symbolic/apps/*.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
  ["../../data/dev.headroom.Headroom.metainfo.xml", "usr/share/metainfo/", "644"],
  ["../../extension/*.js", "usr/share/gnome-shell/extensions/headroom@headroom.dev/", "644"],
  ["../../extension/metadata.json", "usr/share/gnome-shell/extensions/headroom@headroom.dev/", "644"],
  ["../../extension/stylesheet.css", "usr/share/gnome-shell/extensions/headroom@headroom.dev/", "644"],
  ["../../extension/icons/*", "usr/share/gnome-shell/extensions/headroom@headroom.dev/icons/", "644"],
  # Files under etc/ become conffiles: kept on remove, deleted on purge.
  ["../../data/apt/headroom-archive-keyring.gpg", "etc/apt/keyrings/", "644"],
  ["../../data/apt/headroom.sources", "etc/apt/sources.list.d/", "644"],
  ["../../data/apt/52headroom-unattended", "etc/apt/apt.conf.d/", "644"],
  ["../../data/dev.headroom.Headroom-extension.desktop", "etc/xdg/autostart/", "644"],
  ["../../data/dev.headroom.Headroom.service", "usr/share/dbus-1/services/", "644"],
]
