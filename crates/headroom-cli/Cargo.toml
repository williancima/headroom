[package]
name = "headroom-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "headroom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
headroom-core = { version = "0.1.1", path = "../headroom-core" }
keyring = "4.2.0"
rpassword = "7.5.5"
serde_json = "1.0.154"
uuid = "1.29.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
