name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config appstream desktop-file-utils zip
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/headroom-app/Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crates/headroom-app version $version" >&2
            exit 1
          fi
      - name: Check the tag has release notes
        if: github.ref_type == 'tag'
        run: |
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME is not an annotated tag" >&2
            exit 1
          fi
          if [ -z "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | tr -d '[:space:]')" ]; then
            echo "The tag message is empty; releases must have notes" >&2
            exit 1
          fi
      - name: Validate metainfo
        run: appstreamcli validate --no-net data/dev.headroom.Headroom.metainfo.xml
      - run: cargo build --release --workspace
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deb
      - run: cargo deb -p headroom-app --no-build
      - run: scripts/appimage.sh
      - name: Zip the extension
        run: |
          cd extension
          zip -r ../headroom@headroom.dev.shell-extension.zip metadata.json stylesheet.css icons *.js
      - name: Collect release files
        run: |
          mkdir -p release
          cp target/debian/*.deb dist/Headroom-x86_64.AppImage headroom@headroom.dev.shell-extension.zip release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headroom-release
          path: release/*

  # Signs and publishes in a job of its own: no third-party actions, no cache, no build code, so nothing the
  # build ran can be waiting for the signing key. The AppImage self-update only installs a release whose
  # SHA256SUMS carries this signature with the version as trusted comment; a missing or wrong secret fails
  # here, before anything is published.
  publish:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The signing secrets live in the `release` environment, which only `v*` tags can deploy to.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: headroom-release
          path: release
      - run: sudo apt-get update && sudo apt-get install -y minisign apt-utils
      - name: Sign the checksum list
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          key="$RUNNER_TEMP/headroom.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm release/SHA256SUMS -s "$key" -t "headroom $version"
          minisign -Vm release/SHA256SUMS -P RWSJvReAKvMzJnvQTzV973bN63TcYQnRX56PYHpYQz7OhDvR9EyYZMQL \
            | grep -qx "Trusted comment: headroom $version"
      # Flat APT repository holding only the newest .deb; the .deb installs its source, key and an
      # unattended-upgrades origin, so installs update themselves. Built and verified before anything is
      # published, so a missing or wrong GPG secret fails the release here.
      - name: Build and sign the APT repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          pass="$GNUPGHOME/passphrase"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$pass"
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase-file "$pass" --import
          umask 022
          mkdir apt
          cp release/*.deb data/apt/headroom-archive-keyring.gpg apt/
          cd apt
          apt-ftparchive packages . > Packages
          gzip -9k Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=Headroom -o APT::FTPArchive::Release::Label=Headroom \
            release . > Release
          sign() { gpg --batch --pinentry-mode loopback --passphrase-file "$pass" "$@"; }
          sign --clearsign -o InRelease Release
          sign --armor --detach-sign -o Release.gpg Release
          gpgv --keyring ../data/apt/headroom-archive-keyring.gpg InRelease
          gpgv --keyring ../data/apt/headroom-archive-keyring.gpg Release.gpg Release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag release/*
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
